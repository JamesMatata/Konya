{% load i18n %}
<div class="relative" id="language-switcher">
    <button
        type="button"
        id="language-switcher-toggle"
        class="flex items-center gap-1.5 rounded-md bg-[#F8FAFC]/10 px-3 py-2 text-xs font-medium text-[#F8FAFC] transition-colors hover:bg-[#F8FAFC]/20 shadow-none border-0 border-transparent"
        aria-expanded="false"
        aria-controls="language-switcher-menu"
        aria-label="{% trans 'Change language' %}"
    >
        <span>{{ current_language_name }}</span>
        <svg class="h-3.5 w-3.5 text-[#F8FAFC]/60" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z" clip-rule="evenodd"/>
        </svg>
    </button>

    <div
        id="language-switcher-menu"
        class="absolute right-0 top-full z-50 mt-2 hidden min-w-[10rem] rounded-md bg-[#1E293B] p-1.5 shadow-none border-0 border-transparent"
    >
        {% for code, label in languages %}
            <form method="post" action="{% url 'navigator:set_language' %}">
                {% csrf_token %}
                <input type="hidden" name="language" value="{{ code }}">
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <button
                    type="submit"
                    class="w-full rounded-md px-3 py-2 text-left text-xs font-medium transition-colors shadow-none border-0 border-transparent {% if code == current_language %}bg-[#F8FAFC]/15 text-[#F8FAFC]{% else %}text-[#F8FAFC]/70 hover:bg-[#F8FAFC]/10 hover:text-[#F8FAFC]{% endif %}"
                >
                    {{ label }}
                </button>
            </form>
        {% endfor %}
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const switcher = document.getElementById("language-switcher");
        const toggle = document.getElementById("language-switcher-toggle");
        const menu = document.getElementById("language-switcher-menu");
        if (!switcher || !toggle || !menu) return;

        toggle.addEventListener("click", function () {
            const isOpen = !menu.classList.contains("hidden");
            menu.classList.toggle("hidden", isOpen);
            toggle.setAttribute("aria-expanded", String(!isOpen));
        });

        document.addEventListener("click", function (event) {
            if (!switcher.contains(event.target)) {
                menu.classList.add("hidden");
                toggle.setAttribute("aria-expanded", "false");
            }
        });
    });
</script>
